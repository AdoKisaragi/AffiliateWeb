<!doctype html>

<body><a class="skip-link" href="#main">本文へ移動</a>
    <div data-site-header></div>
    <main id="main">
        <header class="page-header">
            <div class="container">
                <nav class="breadcrumb"><a href="index.html">ホーム</a> / 比較記事</nav>
                <div class="eyebrow">PRODUCT COMPARISON</div>
                <h1>用途別に比較したい商品候補</h1>

            </div>

        <section class="section">
            <div class="container">

                    <div>
                        <h2>カテゴリー横断の比較候補</h2>
                    </div>
                </div>
                <div class="table-wrap" tabindex="0">
                    <table class="compare-table">
                        <caption>注目商品の仕様比較</caption>
                        <thead data-comparison-head></thead>
                        <tbody data-comparison></tbody>
                    </table>
                </div>
            </div>
        </section>
        <section class="section section-soft">
            <div class="container">
                <div class="section-head">
                    <div>
                        <h2>編集部ピックアップ</h2>
                    </div>
                    <p>順位ではなく、異なる用途から確認したい商品を掲載します。</p>
                </div>
                <div class="product-list" data-featured-products></div>
            </div>
        </section>
