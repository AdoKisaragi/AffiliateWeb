<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>お問い合わせ｜CHOICE LAB</title>
    <meta name="description" content="CHOICE LABへのご意見、掲載情報の訂正、広告掲載に関するお問い合わせ窓口です。">
    <meta property="og:title" content="お問い合わせ｜CHOICE LAB">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body><a class="skip-link" href="#main">本文へ移動</a>
    <div data-site-header></div>
    <main id="main">
        <header class="page-header">
            <div class="container">
                <nav class="breadcrumb" aria-label="パンくず"><a href="index.html">トップ</a> / お問い合わせ</nav>
                <div class="eyebrow">CONTACT</div>
                <h1>お問い合わせ</h1>
                <p class="lead">掲載情報の訂正、ご意見、広告掲載に関するご相談はこちらからお送りください。</p>
            </div>
        </header>
        <div class="section">
            <div class="container prose">
                <div class="form-note"><strong>デモフォームです。</strong> 静的サイトのため、このままでは送信されません。公開時にフォームサービスまたはメール送信先を設定してください。
                </div>
                <form class="contact-form" action="#" method="post" data-demo-form>
                    <div><label for="category">お問い合わせ種別</label><select id="category" name="category" required>
                            <option value="">選択してください</option>
                            <option>掲載情報について</option>
                            <option>広告掲載について</option>
                            <option>その他</option>
                        </select></div>
                    <div><label for="name">お名前</label><input id="name" name="name" type="text" autocomplete="name"
                            required></div>
                    <div><label for="email">メールアドレス</label><input id="email" name="email" type="email"
                            autocomplete="email" required></div>
                    <div><label for="message">お問い合わせ内容</label><textarea id="message" name="message" required></textarea>
                    </div><label class="check-label"><input type="checkbox" required> <a
                            href="privacy.html">プライバシーポリシー</a>に同意する</label><button class="button"
                        type="submit">内容を確認する（デモ）</button>
                </form>
            </div>
        </div>
    </main>
    <div data-site-footer></div>
    <script src="assets/js/site.js"></script>
    <script>document.querySelector("[data-demo-form]").addEventListener("submit", function (e) { e.preventDefault(); alert("これはデモフォームです。送信機能は公開前に設定してください。") });</script>
</body>

</html>
